<style>
/* Trade-theory tree. Light only; scoped to .tt so it does not touch the rest of the site. */
.tt { --m-bg:#EEF0FB; --m-bd:#5B63C9; --m-t:#2E3483; --m-s:#4A51A8;
      --h-bg:#FBEEE8; --h-bd:#D2683F; --h-t:#6E2A12; --h-s:#94401F;
      --surface:#f5f6f8; --border-strong:#b9bfc7; --faint:#8a929b; }
.page.tt { max-width: 960px; padding-top: 40px; }
.tt .crumb { font-size: 15px; margin: 0 0 18px; color: var(--muted); }
.tt .crumb a { color: var(--link); }
.tt > h1 { margin-bottom: 6px; }
.tt .lead { margin-bottom: 26px; }
.tt .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 2px 8px; }
.tt .tree { min-width: 720px; }
.tt .hint { display: none; font-size: 13px; color: var(--faint); margin: 0 0 6px; }
@media (max-width: 760px) { .tt .hint { display: block; } }
.tt .c { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid; cursor: pointer; font: inherit; background: none; transition: transform .1s, box-shadow .1s; }
.tt .c:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(2,62,138,.10); }
.tt .c:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.tt .c b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.tt .c span { display: block; font-size: 12.5px; line-height: 1.3; margin-top: 2px; }
.tt .m { background: var(--m-bg); border-color: var(--m-bd); } .tt .m b { color: var(--m-t); } .tt .m span { color: var(--m-s); }
.tt .h { background: var(--h-bg); border-color: var(--h-bd); } .tt .h b { color: var(--h-t); } .tt .h span { color: var(--h-s); }
.tt .g { background: var(--surface); border-color: var(--border-strong); } .tt .g b { color: var(--text); } .tt .g span { color: var(--muted); }
.tt .c.on { outline: 2px solid var(--bar); outline-offset: 1px; }
.tt .v { width: 1px; height: 12px; background: var(--border-strong); margin: 0 auto; }
.tt .stem { display: flex; justify-content: center; }
.tt .stem .c { width: 240px; }
.tt .branch { height: 12px; margin: 0 10%; border: 1px solid var(--border-strong); border-bottom: none; }
.tt .lanes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tt .lane { display: flex; flex-direction: column; min-width: 0; }
.tt .lh { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; min-height: 36px; line-height: 1.3; padding: 4px 2px 0; }
.tt .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 14px; color: var(--muted); }
.tt .legend span { display: flex; align-items: center; gap: 6px; }
.tt .sw { width: 13px; height: 13px; border: 1px solid; border-radius: 3px; display: inline-block; }
.tt .sw.m { background: var(--m-bd); } .tt .sw.h { background: var(--h-bd); } .tt .sw.g { background: var(--border-strong); }
.tt .panel { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-top: 20px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.tt .panel h2 { font-size: 22px; font-weight: 600; margin: 0; padding: 0; border: none; }
.tt .yrs { font-size: 14px; color: var(--muted); }
.tt .one { margin: 12px 0 0; padding: 10px 14px; border-left: 4px solid var(--link); background: var(--blue-soft); border-radius: 0 6px 6px 0; font-size: 16.5px; }
.tt .row { display: flex; gap: 12px; margin-top: 12px; }
.tt .row .lb { flex: 0 0 84px; font-size: 14px; color: var(--faint); padding-top: 2px; }
.tt .row .tx { font-size: 16.5px; }
@media (max-width: 520px) { .tt .row { flex-direction: column; gap: 0; } .tt .row .lb { flex: none; } }
</style>
